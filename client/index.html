<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alfred Status 🎩</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    .container { max-width: 600px; width: 100%; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .subtitle { color: #8b949e; margin-bottom: 2rem; }

    .status-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .status-indicator {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }
    .status-indicator.idle { background: #3fb950; box-shadow: 0 0 8px #3fb95066; }
    .status-indicator.coding { background: #f0883e; box-shadow: 0 0 8px #f0883e66; animation: pulse 1.5s infinite; }
    .status-indicator.thinking { background: #58a6ff; box-shadow: 0 0 8px #58a6ff66; animation: pulse 2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-size: 1.4rem;
      font-weight: 600;
      text-transform: capitalize;
    }
    .task-text {
      color: #8b949e;
      margin-top: 0.5rem;
      font-size: 1rem;
    }
    .last-update {
      color: #484f58;
      font-size: 0.8rem;
      margin-top: 0.75rem;
    }

    .log-section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 1.5rem;
    }
    .log-section h2 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: #8b949e;
    }
    .log-entry {
      padding: 0.5rem 0;
      border-bottom: 1px solid #21262d;
      font-size: 0.9rem;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-time {
      color: #484f58;
      font-size: 0.8rem;
      margin-right: 0.5rem;
    }
    .no-log { color: #484f58; font-style: italic; }

    .refresh-note {
      text-align: center;
      color: #484f58;
      font-size: 0.75rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎩 Alfred Status</h1>
    <p class="subtitle">Dashboard en temps réel</p>

    <div class="status-card">
      <div>
        <span class="status-indicator idle" id="indicator"></span>
        <span class="status-text" id="statusText">Chargement...</span>
      </div>
      <div class="task-text" id="taskText"></div>
      <div class="last-update" id="lastUpdate"></div>
    </div>

    <div class="log-section">
      <h2>📋 Activité récente</h2>
      <div id="logEntries"><span class="no-log">Chargement...</span></div>
    </div>

    <p class="refresh-note">⟳ Mise à jour automatique toutes les 5 secondes</p>
  </div>

  <script>
    const STATUS_LABELS = {
      idle: '🟢 Disponible',
      coding: '🟠 En train de coder',
      thinking: '🔵 Réflexion en cours'
    };

    function timeAgo(dateStr) {
      const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
      if (diff < 60) return 'il y a quelques secondes';
      if (diff < 3600) return `il y a ${Math.floor(diff/60)} min`;
      if (diff < 86400) return `il y a ${Math.floor(diff/3600)}h`;
      return `il y a ${Math.floor(diff/86400)}j`;
    }

    function formatTime(dateStr) {
      return new Date(dateStr).toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' });
    }

    async function refresh() {
      try {
        const res = await fetch('/status.json?' + Date.now());
        const data = await res.json();

        const indicator = document.getElementById('indicator');
        indicator.className = 'status-indicator ' + (data.status || 'idle');

        document.getElementById('statusText').textContent =
          STATUS_LABELS[data.status] || STATUS_LABELS.idle;

        document.getElementById('taskText').textContent =
          data.task ? '📌 ' + data.task : '';

        document.getElementById('lastUpdate').textContent =
          data.lastUpdate ? 'Dernière mise à jour: ' + timeAgo(data.lastUpdate) : '';

        const logEl = document.getElementById('logEntries');
        if (data.log && data.log.length > 0) {
          logEl.innerHTML = data.log.slice(-15).reverse().map(e =>
            `<div class="log-entry"><span class="log-time">${formatTime(e.time)}</span>${e.event}</div>`
          ).join('');
        } else {
          logEl.innerHTML = '<span class="no-log">Aucune activité récente</span>';
        }
      } catch(e) {
        console.error('Refresh error:', e);
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
